<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Prefer NotoColorEmoji-bel over Noto Color Emoji -->
  <alias>
    <family>Noto Color Emoji</family>
    <prefer>
      <family>NotoColorEmoji-bel</family>
    </prefer>
  </alias>

  <!-- Also make it the default emoji fallback -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>NotoColorEmoji-bel</family>
    </prefer>
  </alias>

</fontconfig>
